# ---------------------------------------------------------------------------
# UOSC Menu Config
# ---------------------------------------------------------------------------
# The tree below is read by scripts/uosc-menu.lua, which hands it to uosc with
# the icons applied. "@name" picks a Material Icons Rounded ligature from
# fonts/uosc_icons.otf: https://fonts.google.com/icons?icon.style=Rounded
# "?text" describes the entry, shown under the menu while it is hovered.
# Entries that carry a state draw a checkbox or a radio button instead of their
# icon, reflecting mpv when the menu opens: "cycle <prop>", "af toggle <filter>"
# and "change-list glsl-shaders toggle <file>" are checkboxes, "set <prop>
# <value>" is a radio button among the entries that set the same property.
# A "---" part draws a separator under the last entry of the level it sits in,
# so it goes one level up from the entry it follows: "Video > ---", never
# "Video > Video Track > ---".

CTRL+o script-binding    uosc/open-file                                                                #! Open File @file_open ?Browse the disk and play a file, or drop it in the playlist
# script-binding    uosc/show-in-directory                                                             #! Show in Explorer @folder_open ?Open the folder holding the current file, with it selected
p script-binding    uosc/playlist                                                                      #! Playlist @playlist_play ?Everything queued right now; pick an entry to jump to it
F10 script-binding  watched-folder                                                                     #! Move Watched Files @drive_file_move ?Move everything before the furthest file you opened into the watched folder, when you close mpv
#                                                                                                      #! ---
#                   set speed 0.25                                                                     #! Playback @play_circle > Speed @speed ?Pick a playback speed outright, rather than stepping to it > 0.25x @slow_motion_video ?Quarter speed, for catching a single word
#                   set speed 0.50                                                                     #! Playback > Speed > 0.50x @slow_motion_video ?Half speed
#                   set speed 0.75                                                                     #! Playback > Speed > 0.75x @slow_motion_video ?Three quarter speed, still easy to follow
#                   set speed 1.00                                                                     #! Playback > Speed > 1.00x @play_arrow ?Normal speed
#                   set speed 1.25                                                                     #! Playback > Speed > 1.25x @fast_forward ?A quarter faster, barely noticeable on dialogue
#                   set speed 1.50                                                                     #! Playback > Speed > 1.50x @fast_forward ?Half again as fast
#                   set speed 2.00                                                                     #! Playback > Speed > 2.00x @fast_forward ?Double speed
#                   set speed 3.00                                                                     #! Playback > Speed > 3.00x @fast_forward ?Triple speed, about as far as speech stays intelligible
#                   cycle loop-file                                                                    #! Playback > Loop File @repeat_one ?Replays this file forever instead of moving on
<                   no-osd cycle-values play-dir - + ; expand-properties script-message-to osd_theme say "Playback" "${?=play-dir==forward:forwards}${?=play-dir==backward:backwards}" "reverse playback, heavy on the machine and rough on long files" #! Playback > Play Backwards @fast_rewind ?Runs the file in reverse, heavy on the machine and rough on long files
,                   frame-back-step                                                                    #! Playback > Frame Back @skip_previous ?Steps back exactly one frame
.                   frame-step                                                                         #! Playback > Frame Forward @skip_next ?Steps forward exactly one frame

# --- Video -----------------------------------------------------------------
g no-osd cycle interpolation ; expand-properties script-message-to osd_theme say "Interpolation" "${interpolation}" "resamples frames to the screen rate so panning stops juddering" #! Video @movie > Interpolation @animation ?Resample frames to the display rate, killing judder on panning shots
CTRL+v script-binding    uosc/video                                                                    #! Video > Video Track @video_library ?Switch between the video tracks the file carries
d                   no-osd cycle        deinterlace ; expand-properties script-message-to osd_theme say "Deinterlace" "${deinterlace}" "combs out the horizontal tearing old TV video shows on movement" #! Video > Deinterlace @blur_linear ?Combs out the horizontal tearing old TV video shows on movement
SHIFT+d             no-osd cycle        deband ; expand-properties script-message-to osd_theme say "Debanding" "${deband}" "smooths the visible steps in skies and other flat gradients" #! Video > Debanding @gradient ?Smooths the visible steps in skies and other flat gradients
e                   script-binding      uosc/editions                                                  #! Video > Editions @theaters ?Picks between the cuts a file carries, such as theatrical or extended
#                                                                                                      #! Video > ---
2                   no-osd add          contrast    +1 ; expand-properties script-message-to osd_theme say "Contrast" "${contrast}" "distance between the darkest and brightest parts" #! Video > Picture @contrast ?Colour controls, for a source that was graded badly > More Contrast @exposure_plus_1 ?Widens the gap between the darkest and brightest parts
1                   no-osd add          contrast    -1 ; expand-properties script-message-to osd_theme say "Contrast" "${contrast}" "distance between the darkest and brightest parts" #! Video > Picture > Less Contrast @exposure_neg_1 ?Flattens the gap between the darkest and brightest parts
4                   no-osd add          brightness  +1 ; expand-properties script-message-to osd_theme say "Brightness" "${brightness}" "lifts or drops the whole picture at once" #! Video > Picture > Brighter @brightness_high ?Lifts the whole picture at once
3                   no-osd add          brightness  -1 ; expand-properties script-message-to osd_theme say "Brightness" "${brightness}" "lifts or drops the whole picture at once" #! Video > Picture > Darker @brightness_low ?Drops the whole picture at once
6                   no-osd add          gamma       +1 ; expand-properties script-message-to osd_theme say "Gamma" "${gamma}" "opens up the shadows without washing out the highlights" #! Video > Picture > Open Shadows @wb_sunny ?Opens up the shadows, leaving the highlights alone
5                   no-osd add          gamma       -1 ; expand-properties script-message-to osd_theme say "Gamma" "${gamma}" "opens up the shadows without washing out the highlights" #! Video > Picture > Deepen Shadows @nights_stay ?Deepens the shadows, leaving the highlights alone
8                   no-osd add          saturation  +1 ; expand-properties script-message-to osd_theme say "Saturation" "${saturation}" "how strong the colours are, far down is black and white" #! Video > Picture > More Colour @palette ?Strengthens the colour
7                   no-osd add          saturation  -1 ; expand-properties script-message-to osd_theme say "Saturation" "${saturation}" "how strong the colours are, far down is black and white" #! Video > Picture > Less Colour @filter_b_and_w ?Drains the colour, far enough down is black and white
#                                                                                                      #! Video > Picture > ---
ALT+0               no-osd set          contrast    0; no-osd set brightness 0; no-osd set gamma 0; no-osd set saturation 0; no-osd change-list glsl-shaders clr ""; script-message-to osd_theme say "Reset" "picture" "contrast, brightness, gamma, saturation and shaders back to default" #! Video > Picture > Reset Picture @settings_backup_restore ?Colour controls and shaders back to default
# set               video-aspect-override "-1"                                                         #! Video > Aspect Ratio @aspect_ratio ?Override the shape of the picture when the file lies about it > Default @crop_free ?Trust the aspect ratio the file declares
# set               video-aspect-override "16:9"                                                       #! Video > Aspect Ratio > 16:9 @crop_16_9 ?Force widescreen, the shape of most modern video
# set               video-aspect-override "4:3"                                                        #! Video > Aspect Ratio > 4:3 @crop_5_4 ?Force the old TV shape, for pre-HD material
# set               video-aspect-override "2.35:1"                                                     #! Video > Aspect Ratio > 2.35:1 @crop_landscape ?Force cinemascope, for films squeezed into a 16:9 container

# change-list       glsl-shaders toggle ~~/shaders/adasharp.glsl                                       #! Video > Shaders @auto_awesome > Sharpen @deblur ?Recover fine detail on soft or low bitrate sources > Adaptive Sharpen @deblur ?Sharpens by local contrast, so flat areas stay free of ringing
# change-list       glsl-shaders toggle ~~/shaders/NVSharpen.glsl                                      #! Video > Shaders > Sharpen > NVSharpen @deblur ?NVIDIA Image Scaling sharpener, cheap and even handed
# change-list       glsl-shaders toggle ~~/shaders/CAS.glsl                                            #! Video > Shaders > Contrast Adaptive @deblur ?AMD CAS: strongest where the picture is flat, gentle on edges
# change-list       glsl-shaders toggle ~~/shaders/adasharpA.glsl                                      #! Video > Shaders > Line Art @brush ?Tuned for drawn material rather than camera footage > Sharpen @deblur ?Adaptive sharpen retuned for flat cel shaded colour
# change-list       glsl-shaders toggle ~~/shaders/A4K_Thin.glsl                                       #! Video > Shaders > Line Art > Thin Lines @brush ?Anime4K line thinning, undoes the fattening that upscaling causes
# change-list       glsl-shaders toggle ~~/shaders/A4K_Dark.glsl                                       #! Video > Shaders > Line Art > Darken Lines @brush ?Anime4K line darkening, restores outlines washed out by compression
# change-list       glsl-shaders toggle ~~/shaders/F16.glsl                                            #! Video > Shaders > Neural Scaler @memory ?Trained upscalers: the best results and the heaviest on the GPU > FSRCNNX 16 @memory ?Heavy CNN upscaler, the sharpest option for live action
# change-list       glsl-shaders toggle ~~/shaders/ravu_L_ar_r4.hook                                   #! Video > Shaders > Neural Scaler > Ravu Lite ar r4 @memory ?Light trained upscaler with anti-ringing, a good default
