# ---------------------------------------------------------------------------
#  Mouse
#  [MBTN_LEFT/_DBL] [WHEEL_UP/WHEEL_DOWN] [MBTN_RIGHT/_DBR]
#  [MBTN_BACK]      [MBTN_FORWARD]
# ---------------------------------------------------------------------------
MBTN_LEFT           cycle               pause # Pauses or resumes playback
MBTN_LEFT_DBL       cycle               fullscreen # Enters or leaves fullscreen

MBTN_RIGHT          script-binding      uosc_menu/menu-at-cursor # Opens the main menu where the pointer is
CTRL+MBTN_LEFT      script-binding      positioning/drag-to-pan # Drags a zoomed picture around by the point under the pointer

MBTN_BACK           playlist-prev # Plays the previous file in the queue
MBTN_FORWARD        playlist-next # Plays the next file in the queue

WHEEL_UP            no-osd add          volume  +2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume up
WHEEL_DOWN          no-osd add          volume  -2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume down

WHEEL_LEFT          seek                -10 exact # Jumps back ten seconds, on a tilting wheel
WHEEL_RIGHT         seek                +10 exact # Jumps forward ten seconds, on a tilting wheel

CTRL+WHEEL_UP       seek                +5 exact # Jumps forward five seconds
CTRL+WHEEL_DOWN     seek                -5 exact # Jumps back five seconds


# ---------------------------------------------------------------------------
# Media keys
# [PLAY] [PLAYPAUSE] [PLAYONLY] [PAUSEONLY] [PREV] [NEXT] [REWIND] [FORWARD]
# [VOLUME_UP] [VOLUME_DOWN] [MUTE]        [CLOSE_WIN]
# ---------------------------------------------------------------------------

PLAY                cycle               pause # Pauses or resumes playback
PLAYPAUSE           cycle               pause # Pauses or resumes playback
PLAYONLY            set                 pause no # Resumes playback, whatever state it was in
PAUSEONLY           set                 pause yes # Pauses playback, whatever state it was in

PREV                playlist-prev # Plays the previous file in the queue
NEXT                playlist-next # Plays the next file in the queue
REWIND              seek                -60 # Jumps back one minute
FORWARD             seek                +60 # Jumps forward one minute

VOLUME_UP           no-osd add          volume  +2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume up
VOLUME_DOWN         no-osd add          volume  -2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume down
MUTE                no-osd cycle        mute ; expand-properties script-message-to osd_theme say "Mute" "${mute}" "" # Silences the audio without moving the volume

CLOSE_WIN           quit # Closes the player, forgetting where you were


