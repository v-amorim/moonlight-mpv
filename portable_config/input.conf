# ---------------------------------------------------------------------------
# [ESC] [F1] [F2] [F3] [F4] [F5] [F6] [F7] [F8] [F9] [F10] [F11] [F12]
# ---------------------------------------------------------------------------
ESC                 set                 fullscreen  no # Leaves fullscreen, without toggling back into it

F1                  show-text           ${playlist} # Lists the queued files as plain text
F2                  show-text           ${track-list} # Lists every audio and subtitle track the file carries
F4                  script-binding      sub-seek-list # Every subtitle line as a menu; type to filter, pick one to jump there
F5                  script-binding      restart-mpv # Reloads the file at the same position, applying config edits
F6                  script-binding      keybind-visualizer # This map: an on-screen keyboard of every binding, searchable
F8                  no-osd cycle-values sub-font "Roboto Medium" "Impress BT Pace" "Open Sans Semibold" "Noto Sans ExtraBold" ; expand-properties script-message-to osd_theme say "Subtitle font" "${sub-font}" "overrides the typeface the file asks for" # Steps through the four subtitle typefaces
F9                  script-binding      skip-to-silence # Jumps to the next silent gap, usually where the opening ends
F10                 script-binding      watched-folder # Moves everything before the furthest file you opened into the watched folder, when you close mpv
F11                 script-binding      chapter-skip # Auto-skips chapters named as openings, endings, credits or previews
F12                 script-binding      export-selected-subtitles # Writes the active subtitle track next to the video file

SHIFT+F1            no-osd add          sub-delay    -0.05 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "negative shows the line earlier, positive later" # Shows the subtitles earlier, in small steps
SHIFT+F2            no-osd add          sub-delay    +0.05 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "negative shows the line earlier, positive later" # Shows the subtitles later, in small steps
SHIFT+F3            no-osd add          audio-delay  -0.010 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "negative pulls the sound earlier, for lips out of sync" # Pulls the sound earlier when the lips run ahead of it
SHIFT+F4            no-osd add          audio-delay  +0.010 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "positive pushes the sound later, for lips out of sync" # Pushes the sound later when the lips lag behind it
SHIFT+F5            no-osd set          sub-delay    0.0; no-osd set audio-delay 0.0; script-message-to osd_theme say "Reset" "sync" "subtitle and audio delay back to zero" # Puts both the subtitle and audio delay back to zero

ALT+F5              script-binding      reset-all # Zoom, pan, speed, delays, subtitles and colours back to defaults


# ---------------------------------------------------------------------------
# ['] [1] [2] [3] [4] [5] [6] [7] [8] [9] [0] [-] [=] [BS]
# ["] [!] [@] [#] [$] [%] [¨] [&] [*] [(] [)] [_] [+]
# ---------------------------------------------------------------------------
1                   no-osd add          contrast    -1 ; expand-properties script-message-to osd_theme say "Contrast" "${contrast}" "distance between the darkest and brightest parts" # Flattens the gap between the darkest and brightest parts
2                   no-osd add          contrast    +1 ; expand-properties script-message-to osd_theme say "Contrast" "${contrast}" "distance between the darkest and brightest parts" # Widens the gap between the darkest and brightest parts
3                   no-osd add          brightness  -1 ; expand-properties script-message-to osd_theme say "Brightness" "${brightness}" "lifts or drops the whole picture at once" # Darkens the whole picture at once
4                   no-osd add          brightness  +1 ; expand-properties script-message-to osd_theme say "Brightness" "${brightness}" "lifts or drops the whole picture at once" # Lightens the whole picture at once
5                   no-osd add          gamma       -1 ; expand-properties script-message-to osd_theme say "Gamma" "${gamma}" "opens up the shadows without washing out the highlights" # Deepens the shadows, leaving the highlights alone
6                   no-osd add          gamma       +1 ; expand-properties script-message-to osd_theme say "Gamma" "${gamma}" "opens up the shadows without washing out the highlights" # Opens up the shadows, leaving the highlights alone
7                   no-osd add          saturation  -1 ; expand-properties script-message-to osd_theme say "Saturation" "${saturation}" "how strong the colours are, far down is black and white" # Drains the colour, far enough down is black and white
8                   no-osd add          saturation  +1 ; expand-properties script-message-to osd_theme say "Saturation" "${saturation}" "how strong the colours are, far down is black and white" # Strengthens the colour
9                   no-osd add          volume      -2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume down
0                   no-osd add          volume      +2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume up
ALT+0               no-osd set          contrast    0; no-osd set brightness 0; no-osd set gamma 0; no-osd set saturation 0; no-osd change-list glsl-shaders clr ""; script-message-to osd_theme say "Reset" "picture" "contrast, brightness, gamma, saturation and shaders back to default" # Colour controls and shaders back to default
-                   no-osd add          sub-scale   -0.1 ; expand-properties script-message-to osd_theme say "Subtitle size" "${sub-scale}" "1.0 is the size the config asks for" # Shrinks the subtitles
CTRL+-              no-osd add          audio-delay -0.100 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "coarse step, negative pulls the sound earlier" # Pulls the sound earlier, in coarse steps
_                   no-osd cycle        video ; expand-properties script-message-to osd_theme say "Video track" "${vid}" "for the rare file carrying more than one video stream" # Next video track, for files carrying more than one
=                   no-osd add          sub-scale   +0.1 ; expand-properties script-message-to osd_theme say "Subtitle size" "${sub-scale}" "1.0 is the size the config asks for" # Grows the subtitles
CTRL+=              no-osd add          audio-delay +0.100 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "coarse step, positive pushes the sound later" # Pushes the sound later, in coarse steps
BS                  no-osd set          speed       1.0 ; script-message-to osd_theme say "Speed" "1.00" "back to normal playback speed" # Playback speed back to normal

# ALT+BS              set                 video-zoom  +0
# SHIFT+BS            revert-seek
# SHIFT+CTRL+BS       revert-seek         mark
# !                   ignore
# @                   ignore
# SHARP               ignore
# $                   ignore
# %                   ignore
# ¨                   ignore
# &                   ignore
# *                   ignore
# )                   ignore
# (                   ignore
# +                   ignore

ALT+1 no-osd af toggle "@quiet:lavfi=[loudnorm=i=-20]" ; script-message-to osd_theme say-filter "Quiet levelling" "quiet" "holds the whole file near one loudness" # Quiet levelling: holds the whole file near one loudness
ALT+2 no-osd af toggle "@gentle:dynaudnorm=g=5:f=250:r=0.9:p=0.5" ; script-message-to osd_theme say-filter "Gentle auto volume" "gentle" "lifts quiet moments as they come" # Gentle auto volume: lifts quiet moments as they come
ALT+3 no-osd af toggle "@compressor:acompressor=ratio=4,loudnorm" ; script-message-to osd_theme say-filter "Compressor" "compressor" "squashes loud effects so speech stops hiding under them" # Compressor: squashes loud effects so speech stops hiding
ALT+4 no-osd af toggle "@limiter:lavfi=[alimiter=10:1:1:5:8000]" ; script-message-to osd_theme say-filter "Limiter" "limiter" "caps the peaks so explosions stop startling you" # Limiter: caps the peaks so explosions stop startling you
ALT+5 no-osd af toggle "@aggressive:lavfi=[dynaudnorm=g=3:f=250:r=0.9:p=0.9:m=10]" ; script-message-to osd_theme say-filter "Aggressive auto volume" "aggressive" "flattens loud and quiet hard, at the cost of punch" # Aggressive auto volume: flattens loud and quiet hard
ALT+6 no-osd af toggle '@downmix:pan="stereo|FL=0.707*FC+0.3*FL+0.1*BL+0.1*LFE|FR=0.707*FC+0.3*FR+0.1*BR+0.1*LFE"' ; script-message-to osd_theme say-filter "Surround downmix" "downmix" "folds 5.1 into stereo with the dialogue pushed forward" # Surround downmix: 5.1 into stereo, dialogue pushed forward
ALT+7 no-osd af toggle "@streaming:lavfi=[loudnorm=i=-14.0:lra=13.0:tp=-1.0]" ; script-message-to osd_theme say-filter "Streaming loudness" "streaming" "louder than ALT+1 and keeps more of the dynamics" # Streaming loudness: louder than ALT+1, keeps more dynamics


# ---------------------------------------------------------------------------
# [q] [w] [e] [r] [t] [y] [u] [i] [o] [p] [´] [[]
# [Q] [W] [E] [R] [T] [Y] [U] [I] [O] [P] [`] [{]
# ---------------------------------------------------------------------------
q                   quit # Closes the player, forgetting where you were
SHIFT+q             quit-watch-later # Closes the player, resuming here next time

w                   no-osd add          panscan  -0.1 ; expand-properties script-message-to osd_theme say "Pan and scan" "${panscan}" "crops the black bars away by cutting the sides off" # Gives the black bars back
SHIFT+w             no-osd add          panscan  +0.1 ; expand-properties script-message-to osd_theme say "Pan and scan" "${panscan}" "crops the black bars away by cutting the sides off" # Crops the black bars away, cutting the sides off
CTRL+w              quit # Closes the player, forgetting where you were

e                   script-binding      uosc/editions # Picks between the cuts a file carries, such as theatrical or extended

CTRL+r              sub-reload # Re-reads the subtitle file, picking up edits made while playing

SHIFT+t             no-osd cycle        ontop ; expand-properties script-message-to osd_theme say "Always on top" "${ontop}" "keeps the window above every other one" # Keeps the window above every other one

u                   no-osd cycle-values sub-ass-override "force" "yes" ; expand-properties script-message-to osd_theme say "Subtitle styling" "${?=sub-ass-override==force:my font and colours}${?=sub-ass-override==yes:as the file asks}" "styled subtitles carry their own look, this decides who wins" # Whether my font wins over the one a styled subtitle names
SHIFT+u             no-osd cycle        sub-forced-events-only ; expand-properties script-message-to osd_theme say "Forced lines only" "${sub-forced-events-only}" "shows just the signs and foreign speech, not the dialogue" # Shows just the signs and foreign speech, not the dialogue

i                   script-binding      stats/display-stats # Codec, resolution, frame timing and cache, while held
SHIFT+i             script-binding      stats/display-stats-toggle # Pins that same readout on screen until pressed again

o                   show-progress; script-binding uosc/flash-progress # Flashes the timeline and elapsed time
SHIFT+o             no-osd cycle-values osd-level 3 1; script-binding uosc/toggle-progress; expand-properties script-message-to osd_theme say "Timer" "${?=osd-level==3:pinned}${?=osd-level==1:hidden}" "keeps the elapsed time on screen instead of flashing it" # Pins the elapsed time on screen instead of flashing it
CTRL+o              script-binding      uosc/open-file # Browses the disk and plays a file, or drops it in the playlist

p                   script-binding      uosc/playlist # Everything queued right now; pick an entry to jump to it

[                   no-osd add          speed  -0.25 ; expand-properties script-message-to osd_theme say "Speed" "${speed}" "coarse step, pitch stays corrected" # Slows playback in coarse steps, pitch stays corrected
{                   no-osd add          speed  -0.05 ; expand-properties script-message-to osd_theme say "Speed" "${speed}" "fine step, pitch stays corrected" # Slows playback in fine steps, pitch stays corrected



# ---------------------------------------------------------------------------
# [a] [s] [d] [f] [g] [h] [j] [k] [l] [~] []]
# [A] [S] [D] [F] [G] [H] [J] [K] [L] [^] [}]
# ---------------------------------------------------------------------------
a                   no-osd cycle        audio ; expand-properties script-message-to osd_theme say "Audio track" "${?current-tracks/audio/lang:${current-tracks/audio/lang}}${!current-tracks/audio/lang:${aid}}" "language or commentary the film is playing" # Next audio track: another language or a commentary
SHIFT+a             no-osd cycle        audio down ; expand-properties script-message-to osd_theme say "Audio track" "${?current-tracks/audio/lang:${current-tracks/audio/lang}}${!current-tracks/audio/lang:${aid}}" "language or commentary the film is playing" # Previous audio track
CTRL+a              script-binding      uosc/audio # Audio tracks as a menu, rather than cycling blind

s                   no-osd cycle        sub ; expand-properties script-message-to osd_theme say "Subtitle track" "${?current-tracks/sub/lang:${current-tracks/sub/lang}}${!current-tracks/sub/lang:${sid}}" "cycles the tracks the file carries, ending on off" # Next subtitle track, ending on off
SHIFT+s             no-osd cycle        sub down ; expand-properties script-message-to osd_theme say "Subtitle track" "${?current-tracks/sub/lang:${current-tracks/sub/lang}}${!current-tracks/sub/lang:${sid}}" "cycles the tracks the file carries, ending on off" # Previous subtitle track
CTRL+s              script-binding      uosc/subtitles # Subtitle tracks as a menu, rather than cycling blind
ALT+s               screenshot          window # Saves exactly what the window shows, at window size
ALT+SHIFT+s         script-binding      sub_select_menu/menu # Which rule picked this subtitle track, and a switch to stop it picking

d                   no-osd cycle        deinterlace ; expand-properties script-message-to osd_theme say "Deinterlace" "${deinterlace}" "combs out the horizontal tearing old TV video shows on movement" # Combs out the tearing old TV video shows on movement
SHIFT+d             no-osd cycle        deband ; expand-properties script-message-to osd_theme say "Debanding" "${deband}" "smooths the visible steps in skies and other flat gradients" # Smooths the visible steps in skies and other gradients
CTRL+d              no-osd set          deband yes; no-osd set deband-iterations 1; script-message-to osd_theme say "Debanding" "low" "one pass, the cheapest smoothing of gradient steps" # Debanding at one pass, the cheapest setting
CTRL+SHIFT+d        no-osd set          deband yes; no-osd set deband-iterations 2; script-message-to osd_theme say "Debanding" "medium" "two passes, for sources that still show rings" # Debanding at two passes, for sources that still ring
ALT+d               no-osd set          deband yes; no-osd set deband-iterations 3; script-message-to osd_theme say "Debanding" "high" "three passes, heaviest and softest on fine detail" # Debanding at three passes, heaviest on fine detail

f                   cycle               fullscreen # Enters or leaves fullscreen
SHIFT+f             script-binding      display-fps-toggle # Shows how many frames the display is actually drawing

g                   no-osd cycle        interpolation ; expand-properties script-message-to osd_theme say "Interpolation" "${interpolation}" "resamples frames to the screen rate so panning stops juddering" # Resamples frames to the screen rate, killing pan judder

CTRL+h              no-osd set          target-trc bt.1886; script-message-to osd_theme say "Display output" "SDR" "tone the picture for an ordinary screen" # Tones the picture for an ordinary screen
CTRL+SHIFT+h        no-osd set          target-trc pq; script-message-to osd_theme say "Display output" "HDR" "send the wide brightness range an HDR screen expects" # Sends the wide brightness range an HDR screen expects

j                   seek                -86 exact # Jumps back roughly one opening, for when it skipped too far

k                   playlist-shuffle    ; script-message-to osd_theme say "Playlist" "shuffled" "the queue is reordered at random from here on" # Reorders the queue at random from here on
SHIFT+k             playlist-unshuffle  ; script-message-to osd_theme say "Playlist" "unshuffled" "back to the order the files were loaded in" # Back to the order the files were loaded in

l                   seek                +86 exact # Skips roughly one opening
CTRL+l              seek                +177 exact # Skips roughly one opening plus an ending
SHIFT+l             no-osd cycle-values loop-file yes no ; expand-properties script-message-to osd_theme say "Loop" "${loop-file}" "replays this file forever instead of moving to the next" # Replays this file forever instead of moving to the next


]                   no-osd add          speed  +0.25 ; expand-properties script-message-to osd_theme say "Speed" "${speed}" "coarse step, pitch stays corrected" # Speeds playback in coarse steps, pitch stays corrected
}                   no-osd add          speed  +0.05 ; expand-properties script-message-to osd_theme say "Speed" "${speed}" "fine step, pitch stays corrected" # Speeds playback in fine steps, pitch stays corrected


# ---------------------------------------------------------------------------
# [\] [z] [x] [c] [v] [b] [n] [m] [,] [.] [;] [/]
# [|] [Z] [X] [C] [V] [B] [N] [M] [<] [>] [:] [?]
# ---------------------------------------------------------------------------
z                   no-osd add          chapter +1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps to the next marked section of the file" # Jumps to the next marked section of the file
SHIFT+z             no-osd add          chapter -1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps back to the previous marked section" # Jumps back to the previous marked section

x                   screenshot          video # Saves the raw frame at source resolution, without subtitles
SHIFT+x             screenshot          video each-frame # Saves one raw file per frame until pressed again

c                   script-binding      chapters_menu/menu # Every chapter in the file: jump to one, add, rename, delete or export
SHIFT+c             async               screenshot # Saves the frame as shown, subtitles and all, without stuttering
CTRL+c              script-binding      clipshot-subs # Copies the subtitle line playing right now to the clipboard

v                   no-osd cycle        sub-visibility ; expand-properties script-message-to osd_theme say "Subtitles" "${sub-visibility}" "hides the text without losing which track is selected" # Hides the text without losing which track is selected
SHIFT+v             no-osd cycle        sub-ass-use-video-data ; expand-properties script-message-to osd_theme say "Subtitle stretch fix" "${sub-ass-use-video-data}" "reads the video shape to undo stretched or squashed styled text" # Undoes stretched or squashed styled subtitles
CTRL+v              script-binding      uosc/video # Switches between the video tracks the file carries
ALT+v               no-osd cycle        secondary-sub-visibility ; expand-properties script-message-to osd_theme say "Second subtitles" "${secondary-sub-visibility}" "the extra track shown at the top, for a second language" # The extra track at the top, for a second language

b                   no-osd af toggle    "@dialogue:lavfi=[loudnorm=I=-14:TP=-3:LRA=4]" ; script-message-to osd_theme say-filter "Dialogue boost" "dialogue" "levels the track so speech stops hiding under the effects" # Levels the track so speech stops hiding under the effects
n                   script-binding      anilist_menu # Everything AniList: update, fix the match, open the page, link the account
CTRL+n              script-binding      update_anilist # Marks the episode watched on AniList, without opening the menu

m                   no-osd cycle        mute ; expand-properties script-message-to osd_theme say "Mute" "${mute}" "" # Silences the audio without moving the volume

,                   frame-back-step # Steps back exactly one frame
<                   no-osd cycle-values play-dir - + ; expand-properties script-message-to osd_theme say "Playback" "${?=play-dir==forward:forwards}${?=play-dir==backward:backwards}" "reverse playback, heavy on the machine and rough on long files" # Plays backwards, heavy on the machine and rough on long files

.                   frame-step # Steps forward exactly one frame

/                   no-osd set speed    1.0 ; script-message-to osd_theme say "Speed" "1.00" "back to normal playback speed" # Playback speed back to normal
?                   script-binding      console/enable # Type mpv commands and see what they return


# ---------------------------------------------------------------------------
# Arrow Keys  [↑UP]
#     [←LEFT] [↓DOWN] [RIGHT→]
# ---------------------------------------------------------------------------
UP                  no-osd add          volume    +2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume up
DOWN                no-osd add          volume    -2 ; expand-properties script-message-to osd_theme say "Volume" "${volume}" "" # Turns the volume down
LEFT                seek                -5; script-binding uosc/flash-timeline # Jumps back five seconds
RIGHT               seek                +5; script-binding uosc/flash-timeline # Jumps forward five seconds

SHIFT+UP            no-osd              seek      +5 exact # Jumps forward five seconds, landing on the exact frame
SHIFT+DOWN          no-osd              seek      -5 exact # Jumps back five seconds, landing on the exact frame
SHIFT+LEFT          no-osd add          chapter   -1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps back to the previous marked section" # Jumps back to the previous marked section
SHIFT+RIGHT         no-osd add          chapter   +1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps to the next marked section of the file" # Jumps to the next marked section of the file

ALT+UP              no-osd add          video-pan-y  +0.1 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-y}" "slides a zoomed picture around inside the window" # Slides a zoomed picture down inside the window
ALT+DOWN            no-osd add          video-pan-y  -0.1 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-y}" "slides a zoomed picture around inside the window" # Slides a zoomed picture up inside the window
ALT+LEFT            no-osd add          video-pan-x  +0.1 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-x}" "slides a zoomed picture around inside the window" # Slides a zoomed picture right inside the window
ALT+RIGHT           no-osd add          video-pan-x  -0.1 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-x}" "slides a zoomed picture around inside the window" # Slides a zoomed picture left inside the window

CTRL+DOWN           no-osd              sub-seek  0 # Replays the subtitle line currently on screen
CTRL+RIGHT          no-osd              sub-seek  +1 # Jumps the video to the next subtitle line
CTRL+LEFT           no-osd              sub-seek  -1 # Jumps the video back to the previous subtitle line

CTRL+SHIFT+LEFT     no-osd              sub-step  -1 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "shifted by one line, the video keeps playing" # Retimes the subtitles one line back, video keeps playing
CTRL+SHIFT+RIGHT    no-osd              sub-step  +1 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "shifted by one line, the video keeps playing" # Retimes the subtitles one line forward, video keeps playing


# ---------------------------------------------------------------------------
# [SPACE]   [ENTER] [TAB]
# [INSERT]  [HOME]  [PGUP]
# [DEL]     [END]   [PGDOWN]
# [MENU]    [PAUSE]
# ---------------------------------------------------------------------------
SPACE               cycle               pause # Pauses or resumes playback

ALT+ENTER           cycle               fullscreen # Enters or leaves fullscreen

TAB                 script-binding      uosc/toggle-ui # Shows or hides the whole uosc interface
SHIFT+TAB           script-binding      uosc/toggle-progress # Shows or hides the thin progress bar along the bottom

HOME                seek                0 absolute # Jumps back to the very start of the file
SHIFT+HOME          no-osd set          playlist-pos 0 # Plays the first file in the queue
PGUP                playlist-prev # Plays the previous file in the queue
SHIFT+PGUP          no-osd add          chapter  -1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps back to the previous marked section" # Jumps back to the previous marked section

SHIFT+END           no-osd set          playlist-pos-1 ${playlist-count} # Plays the last file in the queue
PGDWN               playlist-next # Plays the next file in the queue
SHIFT+PGDWN         no-osd add          chapter  +1 ; expand-properties script-message-to osd_theme say "Chapter" "${?chapter-metadata/title:${chapter-metadata/title}}${!chapter-metadata/title:${?chapter:${chapter}}${!chapter:none}}" "jumps to the next marked section of the file" # Jumps to the next marked section of the file

MENU                script-binding      uosc_menu/menu # Opens the main menu, centred

PAUSE               script-binding      stats/display-page-4 # The stats page holding the internal performance graphs

# ---------------------------------------------------------------------------
# Numpad
# [KP7]     [KP8]       [KP9]
# [KP4]     [KP5]       [KP6]
# [KP1]     [KP2]       [KP3]
# [KP0]     [KP_DEC]    [KP_ENTER]
# ---------------------------------------------------------------------------
KP0                 no-osd cycle-values video-rotate    90 180 270 0 ; expand-properties script-message-to osd_theme say "Rotation" "${video-rotate}" "turns the picture, for footage shot sideways" # Turns the picture a quarter at a time, for sideways footage
KP1                 no-osd add          video-zoom      -0.05 ; expand-properties script-message-to osd_theme say "Zoom" "${video-zoom}" "0 fits the window, above that the edges are cut off" # Zooms out
KP2                 no-osd add          video-pan-y     +0.01 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-y}" "slides a zoomed picture around inside the window" # Nudges a zoomed picture down
KP3                 no-osd add          video-zoom      +0.05 ; expand-properties script-message-to osd_theme say "Zoom" "${video-zoom}" "0 fits the window, above that the edges are cut off" # Zooms in, cutting the edges off
KP4                 no-osd add          video-pan-x     -0.01 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-x}" "slides a zoomed picture around inside the window" # Nudges a zoomed picture left
KP5                 no-osd set          video-zoom      0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-aspect-override -1 ; script-message-to osd_theme say "Reset" "framing" "zoom, pan and aspect ratio back to default" # Zoom, pan and aspect ratio back to default
KP6                 no-osd add          video-pan-x     +0.01 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-x}" "slides a zoomed picture around inside the window" # Nudges a zoomed picture right
KP7                 no-osd add          video-zoom      -0.05 ; expand-properties script-message-to osd_theme say "Zoom" "${video-zoom}" "0 fits the window, above that the edges are cut off" # Zooms out
KP8                 no-osd add          video-pan-y     -0.01 ; expand-properties script-message-to osd_theme say "Pan" "${video-pan-y}" "slides a zoomed picture around inside the window" # Nudges a zoomed picture up
KP9                 no-osd add          video-zoom      +0.05 ; expand-properties script-message-to osd_theme say "Zoom" "${video-zoom}" "0 fits the window, above that the edges are cut off" # Zooms in, cutting the edges off

