# --- Audio -----------------------------------------------------------------
CTRL+a script-binding    uosc/audio                                                                    #! Audio @volume_up > Audio Track @library_music ?Switch language or commentary track
# script-binding    uosc/audio-device                                                                  #! Audio > Output Device @speaker ?Send sound to another output without restarting playback
#                                                                                                      #! Audio > ---
SHIFT+F3            no-osd add          audio-delay  -0.010 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "negative pulls the sound earlier, for lips out of sync" #! Audio > Sync @av_timer ?Line up the sound with the lips > Sound Earlier @fast_rewind ?Pulls the sound forward when the lips run ahead of it
SHIFT+F4            no-osd add          audio-delay  +0.010 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "positive pushes the sound later, for lips out of sync" #! Audio > Sync > Sound Later @fast_forward ?Pushes the sound back when the lips lag behind it
CTRL+-              no-osd add          audio-delay -0.100 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "coarse step, negative pulls the sound earlier" #! Audio > Sync > Sound Earlier, Coarse @keyboard_double_arrow_left ?Tenth of a second at a time, for a badly muxed file
CTRL+=              no-osd add          audio-delay +0.100 ; expand-properties script-message-to osd_theme say "Audio delay" "${audio-delay}" "coarse step, positive pushes the sound later" #! Audio > Sync > Sound Later, Coarse @keyboard_double_arrow_right ?Tenth of a second at a time, for a badly muxed file
SHIFT+F5            no-osd set          sub-delay    0.0; no-osd set audio-delay 0.0; script-message-to osd_theme say "Reset" "sync" "subtitle and audio delay back to zero" #! Audio > Sync > Reset Both @restart_alt ?Puts subtitle and audio delay back to zero
ALT+1               no-osd af toggle "@quiet:lavfi=[loudnorm=i=-20]" ; script-message-to osd_theme say-filter "Quiet levelling" "quiet" "holds the whole file near one loudness" #! Audio > Loudness @equalizer ?Filters that even out how loud the track runs > Quiet Levelling @volume_down ?Holds the whole file near one loudness
ALT+2               no-osd af toggle "@gentle:dynaudnorm=g=5:f=250:r=0.9:p=0.5" ; script-message-to osd_theme say-filter "Gentle auto volume" "gentle" "lifts quiet moments as they come" #! Audio > Loudness > Gentle Auto Volume @graphic_eq ?Lifts quiet moments as they come
ALT+5               no-osd af toggle "@aggressive:lavfi=[dynaudnorm=g=3:f=250:r=0.9:p=0.9:m=10]" ; script-message-to osd_theme say-filter "Aggressive auto volume" "aggressive" "flattens loud and quiet hard, at the cost of punch" #! Audio > Loudness > Aggressive Auto Volume @equalizer ?Flattens loud and quiet hard, at the cost of punch
ALT+3               no-osd af toggle "@compressor:acompressor=ratio=4,loudnorm" ; script-message-to osd_theme say-filter "Compressor" "compressor" "squashes loud effects so speech stops hiding under them" #! Audio > Loudness > Compressor @compress ?Squashes loud effects so speech stops hiding under them
ALT+4               no-osd af toggle "@limiter:lavfi=[alimiter=10:1:1:5:8000]" ; script-message-to osd_theme say-filter "Limiter" "limiter" "caps the peaks so explosions stop startling you" #! Audio > Loudness > Limiter @vertical_align_center ?Caps the peaks so explosions stop startling you
ALT+7               no-osd af toggle "@streaming:lavfi=[loudnorm=i=-14.0:lra=13.0:tp=-1.0]" ; script-message-to osd_theme say-filter "Streaming loudness" "streaming" "louder than ALT+1 and keeps more of the dynamics" #! Audio > Loudness > Streaming Loudness @podcasts ?Louder than quiet levelling, and keeps more of the dynamics
ALT+6               no-osd af toggle '@downmix:pan="stereo|FL=0.707*FC+0.3*FL+0.1*BL+0.1*LFE|FR=0.707*FC+0.3*FR+0.1*BR+0.1*LFE"' ; script-message-to osd_theme say-filter "Surround downmix" "downmix" "folds 5.1 into stereo with the dialogue pushed forward" #! Audio > Loudness > Surround Downmix @surround_sound ?Folds 5.1 into stereo with the dialogue pushed forward
# af                toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]" ; show-text "${af}"                    #! Audio > Boost Dialogue Volume @record_voice_over ?Levels loudness so quiet speech stops hiding under the effects
# cycle             audio-normalize-downmix                                                            #! Audio > Toggle Normalize @graphic_eq ?Evens out the volume when folding surround down to stereo
# af                clr ""                                                                             #! Audio > Clear Filters @filter_alt_off ?Remove every audio filter and hear the track untouched

# --- Subtitle --------------------------------------------------------------
CTRL+s              script-binding uosc/subtitles                                                      #! Subtitle @subtitles > Subtitle Track @closed_caption ?Pick which subtitle track shows, or turn them off
#                   script-binding uosc/load-subtitles                                                 #! Subtitle > Load Subtitle @upload_file ?Add a subtitle file from disk to this playback
ALT+SHIFT+s script-binding sub_select_menu/menu                                                        #! Subtitle > Automatic Track @rule ?Which rule picked this track, and a switch to stop it picking
#                                                                                                      #! Subtitle > ---
SHIFT+F1            no-osd add          sub-delay    -0.05 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "negative shows the line earlier, positive later" #! Subtitle > Sync @av_timer ?Line up the text with the voices > Subtitles Earlier @fast_rewind ?Shows each line sooner, in twentieth of a second steps
SHIFT+F2            no-osd add          sub-delay    +0.05 ; expand-properties script-message-to osd_theme say "Subtitle delay" "${sub-delay}" "negative shows the line earlier, positive later" #! Subtitle > Sync > Subtitles Later @fast_forward ?Shows each line later, in twentieth of a second steps
SHIFT+F5            no-osd set          sub-delay    0.0; no-osd set audio-delay 0.0; script-message-to osd_theme say "Reset" "sync" "subtitle and audio delay back to zero" #! Subtitle > Sync > Reset Both @restart_alt ?Puts subtitle and audio delay back to zero
CTRL+KP8            no-osd set          sub-pos         0 ; script-message-to osd_theme say "Subtitle position" "top" "moved to the top edge, out of the way of the picture" #! Subtitle > Placement @format_align_center ?Where the text sits and how solid it looks, for burnt in subtitles underneath > Top Edge @vertical_align_top ?Out of the way of the picture, above everything
CTRL+KP5            no-osd set          sub-pos         60 ; script-message-to osd_theme say "Subtitle position" "middle" "lifted off the bottom, clear of burnt in text" #! Subtitle > Placement > Lifted @vertical_align_center ?Off the bottom, clear of burnt in text
CTRL+KP2            no-osd set          sub-pos         100 ; script-message-to osd_theme say "Subtitle position" "bottom" "the usual place, along the bottom edge" #! Subtitle > Placement > Bottom Edge @vertical_align_bottom ?The usual place, along the bottom
#                                                                                                      #! Subtitle > Placement > ---
CTRL+KP6            no-osd set          sub-ass-style-overrides "PrimaryColour=&HFFFFFF" ; script-message-to osd_theme say "Subtitle look" "solid white" "fully opaque, the plain readable default" #! Subtitle > Placement > Solid @opacity ?Fully opaque, the plain readable default
CTRL+KP4            no-osd set          sub-ass-style-overrides "PrimaryColour=&H80FFFFFF" ; script-message-to osd_theme say "Subtitle look" "dimmed white" "half transparent, so burnt in text stays readable underneath" #! Subtitle > Placement > Dimmed @gradient ?Half transparent, so burnt in text stays readable underneath
#                                                                                                      #! Subtitle > Placement > ---
ALT+KP8             no-osd add          sub-pos         -1 ; expand-properties script-message-to osd_theme say "Subtitle position" "${sub-pos}" "0 is the top edge, 100 the bottom" #! Subtitle > Placement > Nudge Up @keyboard_arrow_up ?Moves the text up one line
ALT+KP2             no-osd add          sub-pos         +1 ; expand-properties script-message-to osd_theme say "Subtitle position" "${sub-pos}" "0 is the top edge, 100 the bottom" #! Subtitle > Placement > Nudge Down @keyboard_arrow_down ?Moves the text down one line
CTRL+KP1            no-osd cycle-values sub-pos         60 100; no-osd cycle-values sub-color "#80FFFFFF" "#FFFFFF" ; no-osd cycle-values sub-border-color "#80000000" "#000000" ; no-osd cycle-values sub-shadow-color "#80000000" "#000000" ; no-osd cycle-values sub-ass-override "force" "yes" ; expand-properties script-message-to osd_theme say "Subtitle preset" "${?=sub-pos==100:bottom, solid}${?=sub-pos==60:middle, dimmed}" "position and transparency together, for burnt in text underneath"  #! Subtitle > Placement > Swap Both @swap_vert ?Flips position and transparency together, in one press
F4                  script-binding sub-seek-list                                                       #! Subtitle > Seek to Line @manage_search ?Lists every subtitle line; pick one to jump straight to it
CTRL+r              sub-reload                                                                         #! Subtitle > Reload External @refresh ?Re-read the subtitle file, picking up edits made while playing
F12 script-binding  export-selected-subtitles                                                          #! Subtitle > Export Selected @save_alt ?Write the active subtitle track next to the video file
