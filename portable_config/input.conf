F5  script-binding  restart-mpv                                                                        #! Tools > Restart mpv @restart_alt ?Reload the file at the same position, applying config edits
ALT+F5 script-binding reset-all                                                                        #! Tools > Reset All Settings @settings_backup_restore ?Zoom, pan, speed, delays, subtitles and colours back to defaults
