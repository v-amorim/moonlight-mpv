# anilistUpdater options
# Source: https://github.com/v-amorim/moonlight-mpv

# Push progress to AniList on its own once the file is 85% watched. The menu
# (n) and the mark binding (CTRL+n) work regardless of this.
auto_update=yes

# Restrict that automatic push to files whose full path contains one of these
# fragments, compared case-insensitively. Comma-separated; leave empty to let
# it fire for every file, which is how a non-anime video ends up guessed wrong.
auto_update_paths=animation
