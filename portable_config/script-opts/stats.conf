duration=10
persistent_overlay=no
filter_params_max_length=0

plot_perfdata=no
plot_vsync_ratio=no
plot_vsync_jitter=no

font=Inter Tight Medium
font_mono=JetBrains Mono
font_size=15.5
# stats.lua draws no box, so a thick surface-1 outline stands in as the backdrop
border_size=4
alpha=00

# Moonlight, in the &HBBGGRR& order ASS wants, mirroring scripts/osd-theme.lua.
font_color=FAEEEE
border_color=261714

# stats.lua runs every label through bold() and every unit through it(), both of
# which expand these options, so colour rides along with the weight change.
ass_b1={\b1\1c&HEAB0A2&}
ass_b0={\b0\1c&HFAEEEE&}
ass_it1={\i1\1c&HC4A39B&}
ass_it0={\i0\1c&HFAEEEE&}

plot_bg_border_color=EAB0A2
plot_bg_color=261714
plot_color=FAEEEE
