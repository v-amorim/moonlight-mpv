# Name of the folder watched files are moved into
subfolder=watched

# Where that folder lives: empty = a watched/ next to each file,
# set = every file goes to that one folder, whatever it was playing from
# Absolute path, or an mpv path like ~~/watched or ~/Videos/Watched
destination=

# no: everything before the furthest file you opened counts as watched, so going
#     back to an earlier episode to rewatch a bit still leaves it watched
# yes: only the files whose playback actually reached the end count
require_eof=no
