# Moonlight for mpv's console (mpv 0.41 option names). The backdrop takes
# osd-outline-color from mpv.conf; the completion list's pink is hard-coded in
# console.lua and cannot be set from here.
monospace_font=JetBrains Mono
background_alpha=0
corner_radius=16
menu_outline_size=1
menu_outline_color=#242839
focused_color=#A2B0EA
focused_back_color=#252A42
match_color=#A2B0EA
